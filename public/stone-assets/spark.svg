<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="spark racer">
  <title>spark</title>
  <defs>
    <linearGradient id="rock-s" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#1f1f1f"/>
    </linearGradient>
    <radialGradient id="dust-s" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#888" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#888" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g>
    <circle cx="15" cy="82" r="4" fill="url(#dust-s)">
      <animate attributeName="r" values="2;6;2" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="20;10;20" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="8" cy="85" r="3" fill="url(#dust-s)">
      <animate attributeName="r" values="1;5;1" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- sparks flying off the top -->
  <g>
    <circle cx="55" cy="28" r="1.5" fill="#fbbf24">
      <animate attributeName="cy" values="38;10;38" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="55;62;55" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;0.5;2" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="32" r="1.2" fill="#f97316">
      <animate attributeName="cy" values="36;8;36" dur="1.3s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="40;33;40" dur="1.3s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="1.3s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1.8;0.3;1.8" dur="1.3s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="65" cy="30" r="1" fill="#fbbf24">
      <animate attributeName="cy" values="34;14;34" dur="0.9s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="65;72;65" dur="0.9s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-5; 0,0; 0,-2; 0,0" dur="0.6s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-2 50 60; 2 50 60; -2 50 60" dur="0.6s" repeatCount="indefinite"/>

      <ellipse cx="50" cy="82" rx="22" ry="3" fill="#000" opacity="0.25"/>

      <path d="M 22 72 Q 14 58 24 46 Q 32 36 47 35 Q 62 34 74 41 Q 84 50 82 63 Q 80 76 70 78 Q 55 82 38 80 Q 26 78 22 72 Z"
        fill="url(#rock-s)"/>

      <!-- glowing top edge where sparks fly off -->
      <path d="M 32 40 Q 50 32 68 40" stroke="#f97316" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7">
        <animate attributeName="opacity" values="0.5;0.9;0.5" dur="0.8s" repeatCount="indefinite"/>
      </path>
      <path d="M 30 50 Q 38 45 50 46" stroke="#6a6a6a" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>
</svg>
