<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="ember racer">
  <title>ember</title>
  <defs>
    <linearGradient id="rock-e" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#1f1f1f"/>
    </linearGradient>
    <radialGradient id="dust-e" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#888" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#888" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-e" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g>
    <circle cx="15" cy="82" r="4" fill="url(#dust-e)">
      <animate attributeName="r" values="2;6;2" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="20;10;20" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="8" cy="85" r="3" fill="url(#dust-e)">
      <animate attributeName="r" values="1;5;1" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-5; 0,0; 0,-2; 0,0" dur="0.6s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-2 50 60; 2 50 60; -2 50 60" dur="0.6s" repeatCount="indefinite"/>

      <ellipse cx="50" cy="82" rx="22" ry="3" fill="#000" opacity="0.25"/>

      <!-- inner glow halo -->
      <circle cx="50" cy="58" r="22" fill="url(#glow-e)">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.4s" repeatCount="indefinite"/>
      </circle>

      <path d="M 22 72 Q 14 58 24 46 Q 32 36 47 35 Q 62 34 74 41 Q 84 50 82 63 Q 80 76 70 78 Q 55 82 38 80 Q 26 78 22 72 Z"
        fill="url(#rock-e)"/>

      <!-- glowing cracks -->
      <g stroke-linecap="round" fill="none">
        <path d="M 32 55 L 42 60 L 48 56 L 55 65 L 65 62"
          stroke="#f97316" stroke-width="1.8">
          <animate attributeName="opacity" values="0.7;1;0.8;1;0.7" dur="1.2s" repeatCount="indefinite"/>
        </path>
        <path d="M 38 70 L 45 67 L 52 72"
          stroke="#dc2626" stroke-width="1.5">
          <animate attributeName="opacity" values="0.5;0.9;0.6;0.9;0.5" dur="1.5s" repeatCount="indefinite"/>
        </path>
        <path d="M 60 50 L 68 54"
          stroke="#fbbf24" stroke-width="1.2">
          <animate attributeName="opacity" values="0.4;1;0.5;1;0.4" dur="0.9s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </g>
</svg>
