<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="kindling racer">
  <title>kindling</title>
  <defs>
    <linearGradient id="rock-k" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#1f1f1f"/>
    </linearGradient>
    <linearGradient id="flame-k" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <radialGradient id="dust-k" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#888" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#888" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-k" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g>
    <circle cx="15" cy="82" r="4" fill="url(#dust-k)">
      <animate attributeName="r" values="2;6;2" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="20;10;20" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="8" cy="85" r="3" fill="url(#dust-k)">
      <animate attributeName="r" values="1;5;1" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-5; 0,0; 0,-2; 0,0" dur="0.6s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-2 50 60; 2 50 60; -2 50 60" dur="0.6s" repeatCount="indefinite"/>

      <ellipse cx="50" cy="82" rx="22" ry="3" fill="#000" opacity="0.25"/>

      <!-- flame halo -->
      <circle cx="50" cy="22" r="18" fill="url(#halo-k)">
        <animate attributeName="opacity" values="0.5;0.9;0.5" dur="0.7s" repeatCount="indefinite"/>
      </circle>

      <path d="M 22 72 Q 14 58 24 46 Q 32 36 47 35 Q 62 34 74 41 Q 84 50 82 63 Q 80 76 70 78 Q 55 82 38 80 Q 26 78 22 72 Z"
        fill="url(#rock-k)"/>

      <!-- flame on top -->
      <g>
        <animateTransform attributeName="transform" type="scale"
          values="1 1; 1.1 0.95; 0.95 1.05; 1 1" dur="0.5s" repeatCount="indefinite" additive="sum"/>
        <path d="M 50 38 Q 58 28 56 18 Q 54 12 50 8 Q 46 14 44 22 Q 42 30 50 38 Z"
          fill="url(#flame-k)"/>
        <path d="M 50 32 Q 53 26 52 20 Q 50 16 48 22 Q 46 28 50 32 Z"
          fill="#fef3c7" opacity="0.8"/>
      </g>

      <path d="M 30 50 Q 38 45 50 46" stroke="#6a6a6a" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>
</svg>
