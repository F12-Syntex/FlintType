<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="inferno racer">
  <title>inferno</title>
  <defs>
    <linearGradient id="rock-i" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="flame-i" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="flame-i2" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="dust-i" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-i" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- glowing dust (since rock is on fire) -->
  <g>
    <circle cx="15" cy="82" r="4" fill="url(#dust-i)">
      <animate attributeName="r" values="2;7;2" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="20;8;20" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="8" cy="85" r="3" fill="url(#dust-i)">
      <animate attributeName="r" values="1;6;1" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- big ambient halo -->
  <circle cx="50" cy="50" r="42" fill="url(#halo-i)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="38;44;38" dur="0.8s" repeatCount="indefinite"/>
  </circle>

  <!-- rising embers -->
  <circle cx="42" cy="12" r="1.2" fill="#fbbf24">
    <animate attributeName="cy" values="25;-8;25" dur="1.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1.3s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="42;38;42" dur="1.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="58" cy="10" r="1" fill="#fbbf24">
    <animate attributeName="cy" values="25;-5;25" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="58;63;58" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="6" r="0.9" fill="#fef3c7">
    <animate attributeName="cy" values="22;-10;22" dur="1.1s" begin="0.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="35" cy="20" r="0.8" fill="#f97316">
    <animate attributeName="cy" values="30;-2;30" dur="1.5s" begin="0.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1.5s" begin="0.2s" repeatCount="indefinite"/>
  </circle>

  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-6; 0,0; 0,-3; 0,0" dur="0.55s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-3 50 60; 3 50 60; -3 50 60" dur="0.55s" repeatCount="indefinite"/>

      <ellipse cx="50" cy="82" rx="22" ry="3" fill="#000" opacity="0.3"/>

      <!-- back flames (taller, behind rock) -->
      <g>
        <animateTransform attributeName="transform" type="scale"
          values="1 1; 1.1 0.92; 0.92 1.08; 1.05 0.95; 1 1" dur="0.4s" repeatCount="indefinite" additive="sum"/>
        <path d="M 18 68 Q 10 50 18 28 Q 24 38 28 22 Q 34 30 38 12 Q 44 20 48 4 Q 54 18 58 8 Q 62 22 68 14 Q 72 28 78 24 Q 84 44 82 68 Q 50 78 18 68 Z"
          fill="url(#flame-i)"/>
      </g>

      <!-- rock body (charred, darker) -->
      <path d="M 22 72 Q 14 58 24 46 Q 32 36 47 35 Q 62 34 74 41 Q 84 50 82 63 Q 80 76 70 78 Q 55 82 38 80 Q 26 78 22 72 Z"
        fill="url(#rock-i)" opacity="0.92"/>

      <!-- glowing cracks across rock -->
      <g stroke-linecap="round" fill="none">
        <path d="M 28 58 L 38 62 L 45 58 L 55 65 L 68 60"
          stroke="#fbbf24" stroke-width="2">
          <animate attributeName="opacity" values="0.8;1;0.9;1;0.8" dur="0.6s" repeatCount="indefinite"/>
        </path>
        <path d="M 32 68 L 42 70 L 50 67 L 60 72"
          stroke="#f97316" stroke-width="1.6">
          <animate attributeName="opacity" values="0.7;1;0.8;1;0.7" dur="0.9s" repeatCount="indefinite"/>
        </path>
        <path d="M 60 52 L 70 55"
          stroke="#fef3c7" stroke-width="1.3">
          <animate attributeName="opacity" values="0.5;1;0.6;1;0.5" dur="0.7s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- front flames (over rock top) -->
      <g>
        <animateTransform attributeName="transform" type="scale"
          values="1 1; 1.06 0.94; 0.95 1.05; 1 1" dur="0.35s" repeatCount="indefinite" additive="sum"/>
        <path d="M 38 38 Q 35 28 42 22 Q 46 28 50 18 Q 54 26 58 22 Q 64 30 60 40 Q 50 44 38 38 Z"
          fill="url(#flame-i2)" opacity="0.95"/>
        <path d="M 44 36 Q 44 28 50 24 Q 56 30 54 36 Q 50 38 44 36 Z"
          fill="#fef3c7"/>
      </g>
    </g>
  </g>
</svg>
