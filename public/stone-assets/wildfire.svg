<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="wildfire racer">
  <title>wildfire</title>
  <defs>
    <linearGradient id="rock-w" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="flame-w-back" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="25%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="flame-w-mid" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef3c7"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="flame-w-core" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <radialGradient id="dust-w" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-w" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fire dust trail -->
  <g>
    <circle cx="15" cy="82" r="5" fill="url(#dust-w)">
      <animate attributeName="r" values="3;9;3" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="22;5;22" dur="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="8" cy="85" r="4" fill="url(#dust-w)">
      <animate attributeName="r" values="2;7;2" dur="0.7s" begin="0.25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="0.7s" begin="0.25s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- huge ambient halo -->
  <circle cx="50" cy="48" r="48" fill="url(#halo-w)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="0.6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="44;52;44" dur="0.6s" repeatCount="indefinite"/>
  </circle>

  <!-- rising embers everywhere -->
  <circle cx="40" cy="8" r="1.4" fill="#fbbf24">
    <animate attributeName="cy" values="30;-12;30" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="40;34;40" dur="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="6" r="1.2" fill="#fef3c7">
    <animate attributeName="cy" values="28;-8;28" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="60;67;60" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="2" r="1" fill="#ffffff">
    <animate attributeName="cy" values="25;-15;25" dur="0.9s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="28" cy="18" r="1" fill="#f97316">
    <animate attributeName="cy" values="32;-2;32" dur="1.3s" begin="0.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1.3s" begin="0.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="72" cy="16" r="1" fill="#fbbf24">
    <animate attributeName="cy" values="30;-4;30" dur="1.2s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>

  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-7; 0,0; 0,-3; 0,0" dur="0.5s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-4 50 60; 4 50 60; -4 50 60" dur="0.5s" repeatCount="indefinite"/>

      <ellipse cx="50" cy="83" rx="24" ry="3.5" fill="#000" opacity="0.35"/>

      <!-- massive back flame wall -->
      <g>
        <animateTransform attributeName="transform" type="scale"
          values="1 1; 1.12 0.9; 0.9 1.1; 1.06 0.94; 1 1" dur="0.35s" repeatCount="indefinite" additive="sum"/>
        <path d="M 10 72 Q 4 50 12 22 Q 18 36 22 14 Q 28 26 32 6 Q 38 18 42 2 Q 48 14 50 -2 Q 54 12 58 0 Q 62 14 66 4 Q 70 22 76 12 Q 82 32 88 26 Q 94 52 90 72 Q 50 84 10 72 Z"
          fill="url(#flame-w-back)"/>
      </g>

      <!-- middle flame layer -->
      <g>
        <animateTransform attributeName="transform" type="scale"
          values="1 1; 1.08 0.94; 0.94 1.08; 1 1" dur="0.4s" repeatCount="indefinite" additive="sum"/>
        <path d="M 22 70 Q 16 50 22 30 Q 28 40 32 22 Q 38 32 42 14 Q 48 22 50 8 Q 54 22 58 12 Q 62 26 68 18 Q 74 30 78 30 Q 82 52 78 70 Q 50 78 22 70 Z"
          fill="url(#flame-w-mid)" opacity="0.95"/>
      </g>

      <!-- rock body (charred dark, almost lost in flames) -->
      <path d="M 26 70 Q 18 58 26 48 Q 34 40 47 39 Q 60 38 72 44 Q 80 52 78 64 Q 76 74 68 76 Q 55 80 40 78 Q 28 76 26 70 Z"
        fill="url(#rock-w)" opacity="0.95"/>

      <!-- molten cracks all over rock -->
      <g stroke-linecap="round" fill="none">
        <path d="M 30 56 L 40 60 L 46 56 L 54 64 L 65 60 L 72 56"
          stroke="#fef3c7" stroke-width="2.2">
          <animate attributeName="opacity" values="0.9;1;0.95;1;0.9" dur="0.5s" repeatCount="indefinite"/>
        </path>
        <path d="M 32 66 L 42 68 L 50 65 L 60 70 L 70 67"
          stroke="#fbbf24" stroke-width="1.8">
          <animate attributeName="opacity" values="0.8;1;0.9;1;0.8" dur="0.7s" repeatCount="indefinite"/>
        </path>
        <path d="M 36 50 L 44 52"
          stroke="#ffffff" stroke-width="1.5">
          <animate attributeName="opacity" values="0.7;1;0.8;1;0.7" dur="0.4s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- inner bright core flame on top -->
      <g>
        <animateTransform attributeName="transform" type="scale"
          values="1 1; 1.08 0.92; 0.94 1.06; 1 1" dur="0.3s" repeatCount="indefinite" additive="sum"/>
        <path d="M 40 40 Q 36 30 44 22 Q 48 28 50 18 Q 52 28 56 22 Q 64 30 60 40 Q 50 44 40 40 Z"
          fill="url(#flame-w-core)"/>
      </g>
    </g>
  </g>
</svg>
