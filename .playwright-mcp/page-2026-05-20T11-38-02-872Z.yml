          - generic [ref=e52]: 20 May 2026
        - list [ref=e53]:
          - listitem [ref=e54]:
            - generic [ref=e56]: The Friends page is now a social feed. A timeline shows what your friends are up to, who's typing live, their personal bests, duels, and new friendships, with your friends, following, and followers list right beside it. On desktop the list sits inline next to the feed instead of behind a pop-up panel.
      - generic [ref=e57]:
