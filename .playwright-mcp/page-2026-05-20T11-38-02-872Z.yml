          - generic [ref=e36]: 20 May 2026
        - list [ref=e37]:
          - listitem [ref=e38]:
            - generic [ref=e40]: "Watching a friend now mirrors their whole practice screen: the mode they're on, the live passage as they type, and their full results page when they finish, themed exactly as they see it. It plays back with a smooth one-second buffer so it doesn't stutter."
      - generic [ref=e41]:
        - generic [ref=e42]:
          - heading "6.89.0" [level=3] [ref=e43]
          - generic [ref=e44]: 20 May 2026
        - list [ref=e45]:
          - listitem [ref=e46]:
            - generic [ref=e48]: Watching a friend practise now shows a faithful clone of their actual screen, with their theme, font, caret, and colours, and the same live passage and readouts they're looking at, instead of a stripped-down view.
      - generic [ref=e49]:
        - generic [ref=e50]:
