          - generic [ref=e28]: 20 May 2026
        - list [ref=e29]:
          - listitem [ref=e30]:
            - generic [ref=e32]: Watching a friend is now fullscreen and immersive, with a slim header and a button to go truly fullscreen. And whenever someone is watching you, your practice screen shows a clear "ada is spectating" badge so you always know you're being watched.
      - generic [ref=e33]:
        - generic [ref=e34]:
