        - list [ref=e21]:
          - listitem [ref=e22]:
            - generic [ref=e24]: "Cleaned up the live-watch screen: a slim header with a clear \"Spectating\" indicator, and the friend's screen now fills the whole view edge to edge instead of sitting in a small framed box."
      - generic [ref=e25]:
        - generic [ref=e26]:
